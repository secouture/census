<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Census Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: a clinical operations board. Header + census numbers, then one working view
   (Board by level of care, Week schedule, or Spreadsheet table) with a slide-in client drawer. */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --sunk:#e9eef0; --ink:#16232a; --muted:#5a6a73; --line:#d7dfe3;
  --accent:#2c6b70; --accent-ink:#ffffff;
  --pend:#a86a12; --php:#5946b2; --iop:#16788a; --op:#3a8549; --eiop:#3d5a9e; --dc:#76858d;
  --warn:#a85a06; --crit:#b3261e; --info:#2c6b70;
  --shadow:0 1px 2px rgba(22,35,42,.06),0 4px 14px rgba(22,35,42,.06);
  --f-display:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161a; --surface:#152127; --sunk:#1b2a31; --ink:#e3ebee; --muted:#97a9b2; --line:#26363e;
  --accent:#72b6b9; --accent-ink:#0e161a;
  --pend:#e0ad5c; --php:#ab9ff2; --iop:#5ec5d8; --op:#7fcc90; --eiop:#8fb0f0; --dc:#8d9ba2;
  --warn:#f0a44c; --crit:#f2776c; --info:#72b6b9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161a; --surface:#152127; --sunk:#1b2a31; --ink:#e3ebee; --muted:#97a9b2; --line:#26363e;
  --accent:#72b6b9; --accent-ink:#0e161a;
  --pend:#e0ad5c; --php:#ab9ff2; --iop:#5ec5d8; --op:#7fcc90; --eiop:#8fb0f0; --dc:#8d9ba2;
  --warn:#f0a44c; --crit:#f2776c; --info:#72b6b9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.notice{margin:12px 0 0;padding:8px 12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:12.5px;background:var(--surface)}
.notice b{color:var(--ink)}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0}
.brand .date{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:9px}
.tabs a{padding:6px 14px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px}
.tabs a.gear{display:inline-flex;align-items:center;padding:6px 9px}
body.v-settings #stats,body.v-settings .filters{display:none}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.small{padding:4px 9px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:8px 0 14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .s{font-size:12px;color:var(--muted)}
.stat.alert .v{color:var(--crit)}
.stats{position:relative}
.stat.wide{grid-column:span 2}
.stat .split{display:flex;gap:18px}
.stat .split>div+div{padding-left:18px;border-left:1px solid var(--line)}
.stat .pills{margin-top:4px}
.stat .pill{font-size:12px;padding:2px 7px}
button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer}
button.stat:hover{border-color:var(--muted)}
button.stat[aria-expanded="true"]{border-color:var(--crit);box-shadow:0 0 0 3px color-mix(in srgb,var(--crit) 15%,transparent)}
.navgrp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wk-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:7px 11px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.wk-btn b{min-width:20px;padding:0 6px;border-radius:999px;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);font-size:12px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.wk-btn:hover{filter:brightness(1.08)}
.wk-btn[aria-expanded="true"]{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.pop-sub{margin:0 8px 6px;color:var(--muted);font-size:12px}
.wkov{width:min(560px,calc(100vw - 32px))}
.wk-sum{display:flex;flex-wrap:wrap;gap:6px;margin:0 8px 8px}
.ev{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap;align-self:center}
.ev.adm{color:var(--pend);background:color-mix(in srgb,var(--pend) 14%,transparent)}
.ev.loc{color:var(--iop);background:color-mix(in srgb,var(--iop) 14%,transparent)}
.ev.dc{color:var(--dc);background:color-mix(in srgb,var(--dc) 16%,transparent)}
.wk-day{border-top:1px solid var(--line);padding:6px 0 4px}
.wk-day h3{margin:2px 8px 4px;font-size:13px;font-family:var(--f-display);font-weight:800}
.wk-day h3 span{color:var(--muted);font-weight:500;font-family:inherit;font-size:12px;margin-left:4px}
.wk-day.today h3{color:var(--accent)}
.wk-day.past{opacity:.6}
.attn-pop.wkov li+li{border-top:0}
.attn-pop.wkov li button{flex-direction:row;align-items:center;gap:8px;padding:5px 8px;flex-wrap:wrap}
.wkov .ev{min-width:76px;text-align:center}
.wkov .an{font-size:13px}
.wkov .wd{color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
.attn-pop.wkov .empty{padding:0 8px 4px;font-size:12px}
@media (max-width:560px){.wk-btn .lbl{display:none}.wkov .ev{min-width:0}}
.attn-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:6px 10px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.attn-btn b{min-width:20px;padding:0 6px;border-radius:999px;background:var(--sunk);color:var(--muted);font-size:12px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.attn-btn.on{border-color:color-mix(in srgb,var(--crit) 45%,var(--line));color:var(--crit);background:color-mix(in srgb,var(--crit) 7%,var(--surface))}
.attn-btn.on b{background:var(--crit);color:#fff}
.attn-btn:hover{border-color:var(--crit)}
.attn-btn[aria-expanded="true"]{box-shadow:0 0 0 3px color-mix(in srgb,var(--crit) 18%,transparent)}
@media (max-width:560px){.attn-btn .lbl{display:none}.tabs a{padding:6px 7px}.navgrp{gap:5px}.attn-btn{padding:6px 7px}.wk-btn{padding:7px 8px}}
.attn-scrim{position:fixed;inset:0;z-index:39;background:rgba(15,20,25,.28)}
.attn-pop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:40;width:min(480px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px}
.attn-pop h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:6px 8px 6px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.attn-pop h2 button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px;cursor:pointer}
.attn-pop ul{list-style:none;margin:0;padding:0}
.attn-pop li button{width:100%;border:0;background:none;text-align:left;padding:7px 8px;border-radius:8px;display:flex;flex-direction:column;gap:1px;cursor:pointer;font:inherit;color:inherit}
.attn-pop li button:hover{background:var(--sunk)}
.attn-pop li+li{border-top:1px solid var(--line)}
.attn-pop .an{font-weight:600;font-size:13.5px}
.attn-pop .an span{color:var(--muted);font-weight:500;font-size:12px}
.attn-pop .empty{color:var(--muted);font-size:13px;padding:6px 8px}
.swatch{width:8px;height:8px;border-radius:2px;display:inline-block}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 200px;max-width:320px}
.filters .spacer{flex:1}

/* Attention strip */
.attn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.attn h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;font-weight:600}
.attn ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.attn li button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px 4px 8px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.attn .empty{color:var(--muted);font-size:13px}

/* Board */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px;border:2px solid transparent;transition:border-color .12s,background .12s}
.col.over{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--sunk))}
.col-h{display:flex;align-items:baseline;gap:8px;padding:2px 4px 4px;border-bottom:3px solid var(--c)}
.col-h h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:800;color:var(--c)}
.col-h .n{font-family:var(--f-display);font-weight:700;font-size:16px}
.col-h .sub{font-size:11.5px;color:var(--muted);margin-left:auto;text-align:right}
.col .hint{font-size:12px;color:var(--muted);text-align:center;padding:16px 6px;border:1px dashed var(--line);border-radius:8px}

.card{background:var(--surface);border-radius:9px;padding:9px 10px;box-shadow:var(--shadow);border-left:4px solid var(--c);cursor:grab;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;gap:5px;touch-action:manipulation}
.card:hover{box-shadow:0 0 0 1px var(--line),var(--shadow)}
.card.dragging{opacity:.35}
.card-top{display:flex;align-items:center;gap:6px}
.card .name{font-weight:600;font-size:14px}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:4px;text-transform:uppercase;margin-left:auto;white-space:nowrap}
.tag.lpd{background:color-mix(in srgb,var(--php) 15%,transparent);color:var(--php)}
.tag.com{background:var(--sunk);color:var(--muted)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap}
.days{display:flex;gap:3px;align-items:center}
.days i{font-style:normal;font-size:10px;font-weight:600;width:19px;height:17px;display:grid;place-items:center;border-radius:4px;background:var(--sunk);color:var(--muted);opacity:.55}
.days i.on{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);opacity:1}
.days .freq{font-size:11px;color:var(--muted);margin-left:4px}
.dates{display:flex;gap:10px;font-size:11.5px;color:var(--muted)}
.dates b{color:var(--ink);font-weight:500}
.bar{height:4px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--c)}
.bar.over span{background:var(--warn)}
.flag{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:999px;align-self:flex-start}
.flag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.flag.crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent)}
.flag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.flag.info{color:var(--info);background:color-mix(in srgb,var(--info) 12%,transparent)}

.ghost{position:fixed;z-index:100;pointer-events:none;transform:rotate(2deg);box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:.95}

/* Schedule */
.week{display:grid;grid-template-columns:repeat(6,minmax(175px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent;min-height:200px}
.day.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--sunk))}
.day.today{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.day-h{padding:0 2px 6px;border-bottom:1px solid var(--line)}
.day-h .dn{font-family:var(--f-display);font-weight:800;font-size:16px}
.day-h .dd{color:var(--muted);font-size:12px;margin-left:6px}
.day-h .cnt{font-size:12px;color:var(--muted);margin-top:2px}
.day-h .cnt b{color:var(--ink);font-family:var(--f-display);font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pill{white-space:nowrap;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.pill b{font-weight:700;font-variant-numeric:tabular-nums}
.pill.lpd{--c:var(--muted);background:var(--surface);border:1px solid var(--line)}
.pill.zero{opacity:.45}
.mix{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--line)}
.chip{display:flex;align-items:center;gap:7px;background:var(--surface);border-radius:7px;padding:5px 8px;font-size:13px;cursor:grab;user-select:none;-webkit-user-select:none;box-shadow:var(--shadow);border:0;text-align:left;width:100%;touch-action:manipulation}
.chip{flex-wrap:wrap;row-gap:2px}
.chip .cn{white-space:nowrap;flex:1 0 auto}
.chip .tags{display:flex;gap:6px;margin-left:auto;flex:none;align-items:center}
.chip .lv{margin-left:0}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chip .lv{margin-left:auto;font-size:10.5px;color:var(--c);font-weight:600}
.chip .h{font-size:10px;color:var(--php);font-weight:600}
.chip.dragging{opacity:.35}
/* Full week: one line per client */
.week:not(.three) .chip{font-size:12px;padding:4px 6px;gap:5px;letter-spacing:-.01em}
.week:not(.three) .chip .tags{gap:4px}
.week:not(.three) .chip .lv,.week:not(.three) .chip .h{font-size:9.5px}
.week:not(.three) .chip .dot{width:6px;height:6px}
.wkbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 10px}
.seg.wk{display:inline-flex}
.seg.wk button{padding:6px 14px;white-space:nowrap}
.wknav{display:flex;gap:4px}
.wknav .btn{min-width:34px}
.wknav .btn[disabled]{opacity:.5;cursor:default}
.wkrange{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.week.three{grid-template-columns:repeat(3,minmax(200px,1fr))}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:0 0 10px}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* Table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0;cursor:pointer}
th[aria-sort] {color:var(--ink)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
td .lvl{font-weight:700;color:var(--c)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tbar p{margin:0 auto 0 0;color:var(--muted);font-size:13px}

/* Census rows */
table.census td{vertical-align:middle}
table.arch tbody tr{cursor:default}
.tablewrap.scroll{max-height:max(360px,calc(100vh - 140px));overflow:auto;overscroll-behavior:contain}
table.census thead th{position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 var(--line)}
table.census th:first-child,table.census td:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
table.census thead th:first-child{z-index:3;background:var(--sunk);box-shadow:inset 0 -1px 0 var(--line),inset -1px 0 0 var(--line)}
table.census tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
table.census tbody tr{cursor:default}
table.census tbody tr td:first-child{box-shadow:inset 4px 0 0 var(--c),inset -1px 0 0 var(--line)}
table.census tr.dc td{color:var(--muted)}
.linkish{border:0;background:none;padding:0;font-weight:600;color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--accent)}
.loc-sel,.h-sel{border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);font-weight:700;border-radius:6px;padding:4px 6px;font-size:13px}
.h-sel{--c:var(--muted);font-weight:600}
.loc-sel.static{--c:var(--dc);display:inline-block}
.h-sel.lpd{--c:var(--php)}
.of{color:var(--muted);font-size:11.5px}
.locfilter{display:flex;flex-wrap:wrap;gap:4px}
.locfilter button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--c)}
.locfilter button span{color:var(--muted);font-weight:500;margin-left:2px}
.locfilter button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.locfilter button[aria-pressed="true"] span{color:inherit;opacity:.8}
.tbar p{flex:1 1 200px}

/* Scheduled changes */
.plan-link{border:0;background:none;padding:3px 4px;border-radius:6px;text-align:left;white-space:nowrap;color:var(--ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:3px}
.plan-link:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.plan-link .add{color:var(--accent);font-weight:600}
.plan-link.boxed{border:1px solid var(--line);background:var(--bg);padding:7px 9px;text-decoration:none;font-weight:600;color:var(--accent)}
.planner{gap:14px}
.now{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--c) 10%,var(--surface));font-size:13px}
.now b{color:var(--c)}
.now .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.slot{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 12px 12px;display:flex;flex-direction:column;gap:10px;margin:0;min-width:0}

function moveLoc(id,to){

  const verb=to==='Discharged'?'discharged':from==='Pending'?`admitted to ${to}`:from==='Discharged'?`readmitted to ${to}`:RANK[to]>RANK[from]?`stepped down to ${to}`:`stepped up to ${to}`;

  }else{
    if(from==='Pending'||from==='Discharged'){if(!c.admitDate||c.admitDate>TODAY||from==='Discharged')c.admitDate=TODAY;c.dischargedOn='';c.dcType='';c.dcCompleted='';c.dcLonger=''}

    msg.push(`Schedule set to ${schedSummary(c)}.`);

}
function moveSlot(id,fromDay,toDay,toBlock){
  const c=byId(id);if(!c)return;
  const al=allowedBlocks(c.loc), fromB=blk(c,fromDay);
  if(!al.includes(toBlock)){toast(`${c.loc} meets ${al.map(b=>`${BLOCKS[b].n.toLowerCase()} (${BLOCKS[b].t})`).join(', ')} only.`);return}
  if(toBlock==='EVE'&&!EVE_DAYS.includes(toDay)){toast('Evening groups only run Mon, Tue and Thu nights.');return}
  if(fromDay===toDay&&fromB===toBlock)return;
  if(fromDay!==toDay&&c.days.includes(toDay)){toast(`${c.name} is already scheduled on ${DAY_LABEL[toDay]}.`);return}
  snap();
  const nb={...c.blocks};delete nb[fromDay];nb[toDay]=toBlock;
  setSched(c,c.days.filter(d=>d!==fromDay).concat(toDay),nb);
  const txt=`${DAY_LABEL[fromDay]} ${BLOCKS[fromB].t} moved to ${DAY_LABEL[toDay]} ${BLOCKS[toBlock].t}`;
  c.history.push({date:TODAY,text:`Schedule: ${txt}`});
  save();render();
  toast(`${c.name}: ${txt}.`,true);
}
/* Scheduled LOC changes: on or after each entry's date, apply it automatically. */
function runScheduled(){
  const done=[];
  state.clients.forEach(c=>{
    if(c.dischargedOn&&c.dischargedOn<=TODAY&&c.loc!=='Discharged'&&c.loc!=='Pending'){const from=c.loc;c.lastLoc=from;c.loc='Discharged';c.days=[];c.blocks={};c.plans=[];c.history.push({date:c.dischargedOn,text:`Auto-discharged on date of discharge: ${from} → Discharged`});done.push(`${c.name} → Discharged`)}
    c.plans=(c.plans||[]).filter(p=>p.date&&p.loc).sort((a,b)=>a.date.localeCompare(b.date));
    while(c.plans.length&&c.plans[0].date<=TODAY){
      const p=c.plans.shift(), from=c.loc;
      c.loc=p.loc;
      if(p.loc==='Discharged'){c.dischargedOn=p.date;c.days=[];c.blocks={};c.plans=[]}
      else{
        if(from==='Pending'||from==='Discharged'){c.admitDate=p.date;c.dischargedOn='';c.dcType='';c.dcCompleted='';c.dcLonger=''}
        setSched(c,p.days&&p.days.length?p.days:DEFAULT_DAYS[p.loc],p.blocks||{});
        if(p.loc==='OP'&&(!c.dcDate||c.dcDate<p.date))c.dcDate=addDays(p.date,OP_TO_DC);
      }
      c.history.push({date:p.date,text:`Auto-updated per schedule: ${from} → ${p.loc}${p.loc!=='Discharged'?` · ${schedSummary(c)}`:''}`});
      done.push(`${c.name} → ${p.loc}`);
    }
  });
  if(done.length)save();
  return done;
}

  state.clients.forEach(c=>{
    if(c.admitDate&&c.admitDate>=mon&&c.admitDate<=sat){const first=(c.plans||[])[0];at(c.admitDate,{t:'adm',c,txt:c.loc==='Pending'?(first?`Admits to ${first.loc}`:'Pending admit'):`Admitted to ${c.loc}`})}

}

  if(dayKey(d)==='sun')d=addDays(d,1);
  if(weekShift<0){let x=addDays(d,-1);while(prog.length<3*-weekShift){if(dayKey(x)!=='sun')prog.unshift(x);x=addDays(x,-1)}return prog.slice(0,3).map(date=>({k:dayKey(date),date}))}
  while(prog.length<need){if(dayKey(d)!=='sun')prog.push(d);d=addDays(d,1)}
  return prog.slice(-3).map(date=>({k:dayKey(date),date}));
}

function setField(c,f,v){
  if(f==='commitDays')v=parseInt(v,10)||0;
  if(f==='name'&&!v.trim())return;
  if(f==='dischargedOn'){
    snap();
    if(v&&v<=TODAY&&c.loc!=='Discharged'){const from=c.loc;c.lastLoc=from;c.loc='Discharged';c.days=[];c.blocks={};c.plans=[];c.history.push({date:v,text:`${from} → Discharged`})}
    if(!v&&c.loc==='Discharged'){const back=c.lastLoc||'Pending';c.loc=back;setSched(c,DEFAULT_DAYS[back]||[],{});c.dcType='';c.dcCompleted='';c.dcLonger='';c.history.push({date:TODAY,text:`Date of discharge cleared: back to ${back}`})}
    if(v)c.history.push({date:TODAY,text:`Date of discharge set to ${fmt(v)}`});
  }
  c[f]=v;
  if(f==='dcType'&&v)c.history.push({date:TODAY,text:`Discharge type: ${v}`});
  if((f==='commitDays'||f==='admitDate')&&c.loc!=='Discharged'&&c.commitDays&&c.admitDate){c.dcDate=calcDc(c.admitDate,c.commitDays)}
  save();
  const keepFocus=document.activeElement?.id;
  renderStats();renderStaffFilter();
  $('#view').innerHTML=view==='schedule'?renderSchedule():view==='archive'?renderArchive():view==='settings'?renderSettings():renderCensus();
  if(f!=='name'&&f!=='referral'&&f!=='commitNote'){renderDrawer();if(keepFocus)document.getElementById(keepFocus)?.focus()}
  else $('.drawer-h h2').textContent=c.name;
}

  if(e.target.matches('[data-pf]')){const i=+e.target.dataset.p,k=e.target.dataset.pf,pl=planDraft[i];pl[k]=e.target.value;

/* ---------- day/time picker ---------- */
function pickerHTML(ctx,x){
  const al=allowedBlocks(x.loc), exp=EXPECT[x.loc], n=x.days.length;
  const note=/^PC/.test(x.loc)?'PC meets all day, 9–3:30.':x.loc==='EIOP'?'EIOP meets Mon, Tue and Thu evenings, 6–9pm. Daytime and afternoon IOP groups are available too.':CUSTOM_DAYS.includes(x.loc)?`${x.loc} days vary. Pick the days and a time block for each. Evening groups run Mon, Tue and Thu only.`:'Pick a time block for each day. Evening groups run Mon, Tue and Thu only.';
  return `<div class="fld"><span class="lbl">Days and times · ${n}x/wk${exp&&n!==exp?` <span class="warnt">${x.loc} is ${exp} days</span>`:''}</span>
    <p class="hint">${note}</p>
    <div class="bgrid" style="--c:${cvar(x.loc)}">${DAYS.map(d=>{const on=x.days.includes(d),b=on?((x.blocks||{})[d]||defaultBlock(x.loc,d)):'OFF';
      return `<div class="brow"><span class="bday">${DAY_LABEL[d]}</span><div class="bopts">${['OFF',...blocksFor(x.loc,d)].map(o=>`<button type="button" data-ctx="${ctx}" data-sd="${d}" data-sb="${o}" aria-pressed="${b===o}" class="${o==='OFF'?'off':''}">${o==='OFF'?'Off':`${BLOCKS[o].n}<small>${BLOCKS[o].t}</small>`}</button>`).join('')}</div></div>`}).join('')}</div></div>`;
}
function pickerSet(x,d,o){
  const days=x.days.filter(k=>k!==d), blocks={...(x.blocks||{})};delete blocks[d];
  if(o!=='OFF'){days.push(d);blocks[d]=o}
  x.days=sortDays(days);x.blocks=normBlocks(x.loc,x.days,blocks);
}

/* ---------- scheduled changes card ---------- */
let planDraft=null, planFor=null, planReturn=null;
function closeLayerOrPlanner(){
  if(planFor||schedFor){const ret=planReturn;planFor=null;planDraft=null;schedFor=null;schedDraft=null;planReturn=null;if(ret){openClient(ret);return}}
  closeLayer();
}
function openPlanner(id){
  const c=byId(id);if(!c)return;
  planReturn=openId;openId=null;planFor=id;
  const ps=(c.plans||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  planDraft=[0,1,2].map(i=>ps[i]?{...ps[i],days:[...(ps[i].days||[])],blocks:{...(ps[i].blocks||{})}}:{date:'',loc:'',days:[],blocks:{}});
  renderPlanner();
  setTimeout(()=>$('#p0-date')?.focus(),0);
}
function renderPlanner(){
  const c=byId(planFor);if(!c)return;
  const keep=document.activeElement?.id;
  const err=$('#plan-err')?.textContent||'';
  $('#layer').innerHTML=`<div class="scrim" data-close></div>
  <div class="modal planner" role="dialog" aria-label="Scheduled changes for ${esc(c.name)}">
    <h2>Scheduled changes · ${esc(c.name)}</h2>
    <p>On each date, this client's LOC, days and times update automatically. You can line up to 3 changes.</p>
    <div class="now" style="--c:${cvar(c.loc)}"><span class="lbl">Now</span><b>${LOC_NAME[c.loc]}</b>${LEVELS.includes(c.loc)?` · ${schedSummary(c)}`:''}</div>
    ${planDraft.map((p,i)=>`<fieldset class="slot" style="--c:${p.loc?cvar(p.loc):'var(--accent)'}"><legend>Change ${i+1}</legend>
      <div class="slot-g">
        <div class="fld"><label for="p${i}-date">On this date</label><input type="date" id="p${i}-date" data-p="${i}" data-pf="date" value="${p.date}"></div>
        <div class="fld"><label for="p${i}-loc">Change LOC to</label><select id="p${i}-loc" data-p="${i}" data-pf="loc"><option value="">Choose…</option>${LEVELS.map(l=>`<option value="${l}" ${p.loc===l?'selected':''}>${l}</option>`).join('')}</select></div>
      </div>
      ${p.loc&&p.loc!=='Discharged'?pickerHTML(i,p):''}
      ${p.date||p.loc?`<div><button type="button" class="btn small" data-pclear="${i}">Clear this change</button></div>`:''}
    </fieldset>`).join('')}
    <p id="plan-err" class="err" role="alert">${esc(err)}</p>
    <div class="actions"><span style="flex:1"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="plan-save">Save schedule</button></div>
  </div>`;
  if(keep)document.getElementById(keep)?.focus();
}
function savePlanner(){
  const c=byId(planFor);if(!c)return;
  planDraft.forEach((p,i)=>{p.date=$(`#p${i}-date`).value});
  const used=planDraft.filter(p=>p.date||p.loc);
  const bad=m=>{$('#plan-err').textContent=m};
  if(used.some(p=>!p.date||!p.loc))return bad('Each change needs both a date and a new LOC. Clear any change you don\'t need.');
  if(used.some(p=>p.loc!=='Discharged'&&!p.days.length))return bad('Pick at least one day for each change.');
  if(used.some(p=>p.date<TODAY))return bad('Dates must be today or later.');
  const dates=used.map(p=>p.date);if(new Set(dates).size!==dates.length)return bad('Two changes have the same date. Give each its own date.');
  snap();
  c.plans=used.map(p=>({date:p.date,loc:p.loc,days:p.loc==='Discharged'?[]:[...p.days],blocks:p.loc==='Discharged'?{}:normBlocks(p.loc,p.days,p.blocks)})).sort((a,b)=>a.date.localeCompare(b.date));
  c.history.push({date:TODAY,text:c.plans.length?`Scheduled: ${c.plans.map(p=>`${fmt(p.date)} → ${p.loc}`).join(', ')}`:'Scheduled changes cleared'});
  const done=runScheduled();save();
  closeLayerOrPlanner();render();
  toast(done.length?`Saved. Applied today's change: ${done.join(', ')}.`:c.plans.length?`Saved. ${c.name} moves to ${c.plans[0].loc} on ${fmt(c.plans[0].date)}.`:'Scheduled changes cleared.',true);
}

/* ---------- drag and drop (mouse + touch) ---------- */
let drag=null;
document.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  const el=e.target.closest('[data-drag]');if(!el||el.closest('.drawer'))return;
  drag={el,x:e.clientX,y:e.clientY,active:false,touch:e.pointerType!=='mouse',timer:null,target:null,id:e.pointerId};
  if(drag.touch)drag.timer=setTimeout(()=>{if(drag&&!drag.active)startDrag(drag.x,drag.y)},280);
});
function startDrag(x,y){
  drag.active=true;
  const r=drag.el.getBoundingClientRect();
  const g=drag.el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';
  drag.dx=x-r.left;drag.dy=y-r.top;drag.ghost=g;document.body.appendChild(g);
  drag.el.classList.add('dragging');moveGhost(x,y);
  if(navigator.vibrate)try{navigator.vibrate(10)}catch(_){}
}
function moveGhost(x,y){
  drag.ghost.style.left=(x-drag.dx)+'px';drag.ghost.style.top=(y-drag.dy)+'px';
  const want=drag.el.dataset.drag==='client'?'loc':'day';
  const t=document.elementFromPoint(x,y)?.closest(`[data-drop="${want}"]`)||null;
  if(t!==drag.target){drag.target?.classList.remove('over');t?.classList.add('over');drag.target=t}
  if(y<50)window.scrollBy(0,-12);else if(y>innerHeight-50)window.scrollBy(0,12);
}
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dist=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);
  if(!drag.active){
    if(drag.touch){if(dist>8){clearTimeout(drag.timer);drag=null}return}
    if(dist>5)startDrag(e.clientX,e.clientY);else return;
  }
  moveGhost(e.clientX,e.clientY);
});
document.addEventListener('touchmove',e=>{if(drag&&drag.active)e.preventDefault()},{passive:false});
function endDrag(drop){
  if(!drag)return;clearTimeout(drag.timer);
  if(drag.active){
    const d=drag;d.ghost.remove();d.el.classList.remove('dragging');d.target?.classList.remove('over');
    suppressClick=true;setTimeout(()=>suppressClick=false,50);
    drag=null;
    if(drop&&d.target){
      if(d.el.dataset.drag==='client')moveLoc(d.el.dataset.id,d.target.dataset.loc);
      else moveSlot(d.el.dataset.id,d.el.dataset.day,d.target.dataset.day,d.target.dataset.block);
    }
  }else drag=null;
}
document.addEventListener('pointerup',()=>endDrag(true));
document.addEventListener('pointercancel',()=>endDrag(false));
document.addEventListener('contextmenu',e=>{if(drag&&drag.touch)e.preventDefault()});

/* ---------- CSV export ---------- */
function toCsv(){
  const head=['Client name','Admission date','Projected step-down date','Next LOC','Projected DC date','LOC','Attendance days','Clinician','Case manager','Psych APN','Referral source','Incoming commitment','Commitment days','Housing','Date of discharge','Discharge type','Completed commitment?','Longer than commitment?'];
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
  const rows=state.clients.map(c=>[c.name,fmt(c.admitDate).replace('—',''),nextPlan(c)?fmt(nextPlan(c).date):'',nextPlan(c)?.loc||'',fmt(c.dcDate).replace('—',''),c.loc,schedSummary(c),c.clinician,c.caseManager,c.psychApn,c.referral,c.commitNote,c.commitDays||'',c.housing,c.dischargedOn?fmt(c.dischargedOn):'',c.dcType||'',c.dcCompleted||'',c.dcLonger||'']);
  return [head,...rows].map(r=>r.map(q).join(',')).join('\n');
}
function copyCsv(btn){
  const text=toCsv();
  const done=()=>{btn.textContent='Copied. Paste into Excel';setTimeout(()=>btn.textContent='Copy as spreadsheet (CSV)',2500)};
  try{navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text))}catch(_){fallbackCopy(text)}
}
function fallbackCopy(text){
  $('#layer').innerHTML=`<div class="scrim" data-close></div><div class="modal" role="dialog" aria-label="Copy CSV"><h2>Copy the census</h2><p>Select all of this text and copy it, then paste into Excel.</p><textarea id="csv-out" readonly>${esc(text)}</textarea><div class="actions"><button class="btn" data-close>Close</button></div></div>`;
  const t=$('#csv-out');t.focus();t.select();
}

/* ---------- import ---------- */
function parseCsv(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;
    else if(ch===','||ch==='\t'){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
const FIELD_LABEL={name:'Client name',admitDate:'Admission date',stepDown:'Projected step-down',dcDate:'Projected DC',loc:'LOC',freq:'Frequency',days:'Schedule',clinician:'Clinician',caseManager:'Case manager',psychApn:'Psych APN',referral:'Referral source',commit:'Incoming commitment',housing:'Housing (LPD/commuter)'};
function matchHeader(h){
  const s=String(h).toLowerCase().replace(/[^a-z]/g,'');
  if(!s)return null;
  if(/step/.test(s))return 'stepDown';
  if(/dc|discharg/.test(s))return 'dcDate';
  if(/admi|start/.test(s))return 'admitDate';
  if(/freq/.test(s))return 'freq';
  if(/sched|days/.test(s))return 'days';
  if(/case|^cm/.test(s))return 'caseManager';
  if(/psych|apn|prescrib|np$/.test(s))return 'psychApn';
  if(/clinician|therapist|primary/.test(s))return 'clinician';
  if(/referr|source/.test(s))return 'referral';
  if(/commit|plan|los/.test(s))return 'commit';
  if(/hous|lpd|commut|resid/.test(s))return 'housing';
  if(/loc|level|program/.test(s))return 'loc';
  if(/name|client|patient/.test(s))return 'name';
  return null;
}
function parseDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))return iso(v);
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/)){let y=+m[3];if(y<100)y+=2000;return `${y}-${pad(m[1])}-${pad(m[2])}`}
  const d=new Date(s);return isNaN(d)?'':iso(d);
}
function parseLoc(v,fq){const s=String(v||'').toLowerCase().replace(/\s+/g,'');
  const n=+((s.match(/(\d)/)||String(fq||'').match(/(\d)/)||[])[1]||0);
  if(/eiop|evening/.test(s))return 'EIOP';
  if(/^pc|php|partial/.test(s))return n===6?'PC6':'PC5';
  if(/iop|intensive/.test(s))return n>=3&&n<=6?'IOP'+n:'IOP3';
  if(/disch|^dc/.test(s))return 'Discharged';if(/pend|refer|wait|incoming/.test(s))return 'Pending';
  if(/op|outpat/.test(s))return 'OP';return ''}
function parseDays(v,loc){
  const s=String(v||'').toLowerCase();
  if(/daily|weekdays/.test(s))return ['mon','tue','wed','thu','fri'];
  const map={mon:'mon',m:'mon',tue:'tue',tues:'tue',tu:'tue',t:'tue',wed:'wed',w:'wed',thu:'thu',thur:'thu',thurs:'thu',th:'thu',r:'thu',fri:'fri',f:'fri',sat:'sat',sa:'sat',s:'sat'};
  const tok=x=>map[(x.match(/mon|tues?|wed|thur?s?|fri|sat|th|tu|sa|m|t|w|r|f|s/)||[])[0]];
  const rg=s.match(/^\s*([a-z]+)\s*[-–]\s*([a-z]+)\s*$/);
  if(rg&&tok(rg[1])&&tok(rg[2])){const i=DAYS.indexOf(tok(rg[1])),j=DAYS.indexOf(tok(rg[2]));if(i<=j)return DAYS.slice(i,j+1)}
  const out=new Set();(s.match(/mon|tues?|wed|thur?s?|fri|sat|th|tu|sa|m|t|w|r|f|s/g)||[]).forEach(t=>map[t]&&out.add(map[t]));
  const d=[...out].sort((a,b)=>DAYS.indexOf(a)-DAYS.indexOf(b));
  return d.length?d:[...(DEFAULT_DAYS[loc]||[])];
}
function parseCommit(v){const s=String(v||'');let m,days=0;
  if(m=s.match(/(\d+)\s*(w|wk|week)/i)){days=0;s.replace(/(\d+)\s*(?:w|wk|weeks?)\b/gi,(_,n)=>{days+=n*7})}
  else if(m=s.match(/(\d+)\s*d/i))days=+m[1];
  else if(m=s.match(/^\s*(\d+)\s*$/))days=+m[1];
  return {commitDays:days,commitNote:s.trim()}}
let pending=null;
function openImport(){
  pending=null;
  $('#layer').innerHTML=`<div class="scrim" data-close></div>
  <div class="modal" role="dialog" aria-label="Import spreadsheet">
    <h2>Import your census spreadsheet</h2>
    <p>Choose an Excel (.xlsx) or CSV file, or paste rows copied from Excel. The first row should be column headings such as Client name, Admission date, LOC, Clinician. Use made-up names only in this prototype.</p>
    <label class="drop-zone" id="dz" for="imp-file"><input id="imp-file" type="file" accept=".xlsx,.xls,.csv,.tsv,.txt" hidden><b>Choose a file</b> or drop it here</label>
    <textarea id="imp-paste" placeholder="…or paste spreadsheet rows here"></textarea>
    <div id="imp-preview"></div>
    <div class="actions"><button class="btn" id="imp-sample">Try a sample sheet</button><span style="flex:1"></span><button class="btn" data-close>Cancel</button></div>
  </div>`;
}

function previewRows(rows){
  const box=$('#imp-preview');
  if(!rows||rows.length<2){box.innerHTML='<p class="err">I couldn\'t find a heading row plus at least one client row.</p>';return}
  const head=rows[0], map=head.map(matchHeader);
  if(!map.includes('name')){box.innerHTML='<p class="err">I couldn\'t find a client name column. Add a heading like "Client name" to the first row.</p>';return}
  const clients=rows.slice(1).map((r,i)=>{
    const g=k=>{const ix=map.indexOf(k);return ix<0?'':r[ix]};
    const loc=parseLoc(g('loc'),g('freq'))||'Pending';
    const cm=parseCommit(g('commit'));
    const name=String(g('name')||'').trim();if(!name)return null;
    const sd=parseDate(g('stepDown')), to=NEXT_LOC[loc]==='Discharged'?null:NEXT_LOC[loc];
    const plans=sd&&to&&loc!=='Discharged'?[{date:sd,loc:to,days:[...(DEFAULT_DAYS[to]||[])]}]:[];
    const st=String(g('days')).toLowerCase(), hint=/6\s*-\s*9|eve|night/.test(st)?'EVE':/12:30|after|pm/.test(st)?'PM':'AM';
    const dd=LEVELS.includes(loc)?parseDays(g('days'),loc):[];
    if(plans[0])plans[0].blocks=normBlocks(plans[0].loc,plans[0].days,{});
    return {id:'i'+(state.seq++),name,loc,plans,blocks:normBlocks(loc,dd,uniform(dd,hint)),admitDate:parseDate(g('admitDate')),dcDate:parseDate(g('dcDate'))||(loc!=='Discharged'?calcDc(parseDate(g('admitDate')),cm.commitDays):''),
      days:dd,clinician:String(g('clinician')||'').trim(),caseManager:String(g('caseManager')||'').trim(),psychApn:String(g('psychApn')||'').trim(),
      referral:String(g('referral')||'').trim(),...cm,housing:/lpd|resid|sober|house|yes/i.test(String(g('housing')))?'LPD':'Commuter',
      dischargedOn:loc==='Discharged'?(parseDate(g('dcDate'))||TODAY):'',history:[{date:TODAY,text:'Imported from spreadsheet'}]};
  }).filter(Boolean);
  pending=clients;
  const found=Object.keys(FIELD_LABEL).filter(k=>map.includes(k)), missing=Object.keys(FIELD_LABEL).filter(k=>!map.includes(k)&&k!=='freq');
  box.innerHTML=`<p><b style="color:var(--ink)">${clients.length} clients found.</b> Columns matched:</p>
    <div class="maplist">${found.map(k=>`<span>${FIELD_LABEL[k]}</span>`).join('')}${missing.map(k=>`<span class="miss">No ${FIELD_LABEL[k]}</span>`).join('')}</div>
    <div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Client</th><th>LOC</th><th>Admitted</th><th>Schedule</th><th>Step-down</th><th>Clinician</th><th>Housing</th></tr></thead>
    <tbody>${clients.slice(0,5).map(c=>`<tr><td>${esc(c.name)}</td><td>${c.loc}</td><td class="mono">${fmt(c.admitDate)}</td><td>${schedSummary(c)||'—'}</td><td>${c.plans[0]?`${fmt(c.plans[0].date)} → ${c.plans[0].loc}`:'—'}</td><td>${esc(c.clinician)||'—'}</td><td>${c.housing}</td></tr>`).join('')}</tbody></table></div>
    ${clients.length>5?`<p>…and ${clients.length-5} more.</p>`:''}
    <div class="actions" style="margin-top:10px"><button class="btn primary" id="imp-add">Add ${clients.length} to census</button><button class="btn" id="imp-replace">Replace census with these ${clients.length}</button></div>`;
}
function readRows(input){
  if(window.XLSX){
    const wb=typeof input==='string'?XLSX.read(input,{type:'string',cellDates:true}):XLSX.read(input,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}).filter(r=>r.some(x=>String(x).trim()));
  }
  if(typeof input!=='string')throw new Error('Excel files need a connection to load the reader. Save the sheet as CSV and try again.');
  return parseCsv(input);
}
function handleFile(f){
  const r=new FileReader();
  const isText=/\.(csv|tsv|txt)$/i.test(f.name);
  r.onload=()=>{try{previewRows(isText?parseCsv(r.result):readRows(new Uint8Array(r.result)))}catch(err){$('#imp-preview').innerHTML=`<p class="err">${esc(err.message||'That file could not be read.')}</p>`}};
  isText?r.readAsText(f):r.readAsArrayBuffer(f);
}
document.addEventListener('change',e=>{if(e.target.id==='imp-file'&&e.target.files[0])handleFile(e.target.files[0])});
document.addEventListener('input',e=>{if(e.target.id==='imp-paste'){const v=e.target.value;if(v.trim())previewRows(parseCsv(v))}});
document.addEventListener('dragover',e=>{const dz=e.target.closest?.('#dz');if(dz){e.preventDefault();dz.classList.add('over')}});
document.addEventListener('dragleave',e=>{e.target.closest?.('#dz')?.classList.remove('over')});
document.addEventListener('drop',e=>{const dz=e.target.closest?.('#dz');if(dz){e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)handleFile(f)}});
document.addEventListener('click',e=>{
  if(e.target.id==='imp-sample'){
    const t=`Client name,Admission date,Projected step-down date,Projected DC date,LOC,Frequency,Attendance schedule,Clinician,Case manager,Psych APN,Referral source,Incoming commitment,LPD or commuter
Sample Person A,${fmt2(-10)},${fmt2(11)},${fmt2(45)},PHP,6x,M-Sa,R. Patel LCSW,T. Nguyen,L. Moreau PMHNP,Detox center,PC 3 wks IOP 4 wks,LPD
Sample Person B,${fmt2(-25)},${fmt2(6)},${fmt2(30)},IOP,4x,M T W Th 12:30-3:30,M. Okafor LPC,K. Brooks,A. Castillo PMHNP,EAP,IOP 6 wks,Commuter
Sample Person C,${fmt2(3)},,,Pending,,,J. Lindqvist LMFT,S. Haddad,L. Moreau PMHNP,Hospital ED,PC 4 wks,LPD`;
    $('#imp-paste').value=t;previewRows(parseCsv(t));
  }
  if((e.target.id==='imp-add'||e.target.id==='imp-replace')&&pending){
    snap();const n=pending.length;
    if(e.target.id==='imp-replace')state.clients=pending;else state.clients.push(...pending);
    ensureStaff(state);
    pending=null;const done=runScheduled();save();closeLayer();render();toast(`Imported ${n} clients.${done.length?` Applied ${done.length} scheduled change(s) dated today or earlier.`:''}`,true);
  }
});
function fmt2(n){const d=pISO(addDays(TODAY,n));return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`}

/* ---------- routing ---------- */
function route(){const h=location.hash.slice(1);view=['schedule','archive','settings'].includes(h)?h:'census';render()}
addEventListener('hashchange',route);
const bootDone=runScheduled();
route();
if(bootDone.length)toast(`Scheduled changes applied today: ${bootDone.join(', ')}.`);
setInterval(()=>{const t=iso(new Date());if(t!==TODAY){TODAY=t;const d=runScheduled();render();if(d.length)toast(`Scheduled changes applied today: ${d.join(', ')}.`)}},60000);
})();
</script>
